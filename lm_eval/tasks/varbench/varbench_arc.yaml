tag:
  - varbench
task: varbench_arcplus
dataset_path: LehuyH/VarBenchArcPlus
dataset_name: default
output_type: multiple_choice
test_split: test
doc_to_text: "Question: {{question.stem}}\nAnswer:"
doc_to_target: "{{ (question.choices|map(attribute='label')|list).index(answerKey) }}"
doc_to_choice: "{{question.choices|map(attribute='text')|list }}"
should_decontaminate: true
doc_to_decontamination_query: "Question: {{question.stem}}\nAnswer:"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.1