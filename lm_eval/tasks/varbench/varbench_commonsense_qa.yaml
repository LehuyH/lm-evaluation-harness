task: varbench_commonsense_qa
dataset_path: LehuyH/VarBenchCSQA
validation_split: validation
output_type: multiple_choice
doc_to_text: "Question: {{ question.stem.strip() }}\nA. {{question.choices[0].text.strip()}}\nB. {{question.choices[1].text.strip()}}\nC. {{question.choices[2].text.strip()}}\nD. {{question.choices[3].text.strip()}}\nE. {{question.choices[4].text.strip()}}\nAnswer:"
doc_to_target: answerKey
doc_to_choice: ['A', 'B', 'C', 'D', 'E']
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true